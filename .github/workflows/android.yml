name: Android CI and preview releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_emulator:
        description: Run the emulator install and launch check
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build, JVM tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install pinned Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Restore existing preview signing key
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if (!$env:KEYSTORE_BASE64) { throw 'ANDROID_DEBUG_KEYSTORE_BASE64 is required for preview builds' }
          $path = Join-Path $env:RUNNER_TEMP 'flibusta-preview.keystore'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "ANDROID_DEBUG_KEYSTORE_PATH=$path" >> $env:GITHUB_ENV
      - name: Validate package metadata
        shell: pwsh
        run: ./scripts/test-release-metadata.ps1
      - name: Bootstrap Gradle wrapper with network retries
        run: |
          for attempt in 1 2 3; do
            if bash ./gradlew --version; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Build and check
        run: bash ./gradlew :core:opds:test :core:format:test :app:assembleDebug :app:lintDebug --console=plain
      - name: Package APK with compatibility notes and checksums
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $packageArgs = @{}
          if ($env:REF_TYPE -eq 'tag') { $packageArgs.Tag = $env:REF_NAME }
          if ($env:REF_TYPE -eq 'tag' -or $env:EVENT_NAME -eq 'workflow_dispatch') {
            $packageArgs.SigningKind = 'preview'
            $packageArgs.ExpectedCertificateSha256 = 'b3e3703d07d76a6474ef19620632a092763d101db5750ab2c00f311582e8358f'
          }
          ./scripts/package-release.ps1 @packageArgs
      - name: Remove restored signing key
        if: always()
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'flibusta-preview.keystore'
          if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path }
      - name: Upload APK package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-package
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: |
            core/*/build/reports/tests/
            core/*/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

  emulator:
    name: Android 15 install and launch check
    needs: build
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.run_emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-package
          path: artifacts/release/
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: pwsh -NoProfile -File scripts/ci-emulator.ps1
      - name: Upload Android regression reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-regression-reports
          path: .tools/
          include-hidden-files: true
          retention-days: 14

  release:
    name: Publish release
    needs: [build, emulator]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-package
          path: artifacts/release/
      - name: Prepare labelled release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/publish-release.ps1 -Tag $env:RELEASE_TAG
